
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 09</title>

    <style>
        body {
            background-color: white;
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 30px auto;
            padding: 10px;
            background-color: white;
            box-shadow: 0 0 12px gray;
        }

        h1 {
            margin: 12px 0 20px;
            color: black;
            font-size: 32px;
        }

        .first {
            background-color: lightblue;
            border: 8px double tomato;
            padding: 2px;
        }

        .second {
            background-color: yellow;
            border: 3px solid dodgerblue;
            border-radius: 10px;
        }

        .third {
            background-color: mediumseagreen;
            border: 10px dotted gray;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="first">Hello World</h1>
        <h1 class="second">Hello World</h1>
        <h1 class="third">Hello World</h1>
    </div>
</body>
</html>
